# Publishes Rust release binaries of ECT.
#
# Triggered by tags of the form `rust-v*` (e.g. rust-v0.11.0), so releases of
# the Go, Rust and C/C++ branches never collide.
# Asset naming: ect-rust_<tag>_<os>_<arch>.(zip|tar.gz), plus checksums.txt.
name: release

on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. rust-v0.11.0)'
        required: true
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BINARY_NAME: ect
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: darwin,  arch: amd64, runner: macos-latest,     target: x86_64-apple-darwin }
          - { os: darwin,  arch: arm64, runner: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows, arch: amd64, runner: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows, arch: arm64, runner: windows-latest,   target: aarch64-pc-windows-msvc }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tests can only run where the target matches the runner's CPU.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          artifact="${BINARY_NAME}-rust_${RELEASE_TAG}_${{ matrix.os }}_${{ matrix.arch }}"
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"
          fi

          cargo build --release --locked --target "${{ matrix.target }}"

          mkdir -p "dist/${artifact}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${ext}" "dist/${artifact}/"

          if [ "${{ matrix.os }}" = "windows" ]; then
            (cd dist && 7z a -tzip "${artifact}.zip" "${artifact}" > /dev/null)
          else
            tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
          fi

          rm -rf "dist/${artifact}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/*
