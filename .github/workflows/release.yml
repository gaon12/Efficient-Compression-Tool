# Publishes C/C++ release binaries of ECT.
#
# Triggered by tags of the form `cpp-v*` (e.g. cpp-v0.9.7), so releases of
# the Go, Rust and C/C++ branches never collide.
# Asset naming: ect-cpp_<tag>_<os>_<arch>.(zip|tar.gz), plus checksums.txt.
#
# Release binaries are built with -DECT_WEBP_SUPPORT=OFF so they do not
# depend on a system libwebp at runtime.
name: release

on:
  push:
    tags:
      - 'cpp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. cpp-v0.9.7)'
        required: true
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BINARY_NAME: ect
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-unix:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: amd64, runner: ubuntu-latest }
          - { os: linux,  arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm ninja

      - name: Build
        run: |
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DECT_WEBP_SUPPORT=OFF
          cmake --build build --parallel

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh ./build/ect

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          artifact="${BINARY_NAME}-cpp_${RELEASE_TAG}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/${artifact}"
          cp "build/${BINARY_NAME}" "dist/${artifact}/"
          strip "dist/${artifact}/${BINARY_NAME}" || true
          tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
          rm -rf "dist/${artifact}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-windows:
    name: build-windows-amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NASM
        run: choco install nasm --no-progress -y

      # MSVC with the static runtime (/MT) so ect.exe has no dependency on
      # the Visual C++ redistributable.
      - name: Build
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          cmake -S src -B build -A x64 -DECT_WEBP_SUPPORT=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"
          cmake --build build --config Release --parallel

      - name: Smoke test
        shell: bash
        run: bash .github/scripts/smoke-test.sh ./build/Release/ect.exe

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          artifact="${BINARY_NAME}-cpp_${RELEASE_TAG}_windows_amd64"
          mkdir -p "dist/${artifact}"
          cp "build/Release/${BINARY_NAME}.exe" "dist/${artifact}/"
          (cd dist && 7z a -tzip "${artifact}.zip" "${artifact}" > /dev/null)
          rm -rf "dist/${artifact}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/*.zip

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: [build-unix, build-windows]
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/*
