# CI for the Go implementation of ECT (branch `go`).
name: go

on:
  push:
    branches: [go]
  pull_request:
    branches: [go]

permissions:
  contents: read

jobs:
  test:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Formatting is OS independent; checking it once is enough.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race detector on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race ./...
          else
            go test ./...
          fi
